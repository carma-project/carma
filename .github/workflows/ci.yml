name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: carma
          POSTGRES_PASSWORD: carma
          POSTGRES_DB: carma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carma -d carma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://carma:carma@localhost:5432/carma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run migrate
      - run: npm test
