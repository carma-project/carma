services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: carma
      POSTGRES_PASSWORD: carma
      POSTGRES_DB: carma
    volumes:
      # Migrations run in filename order on first initialization of the volume.
      - ./adapters/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carma -d carma"]
      interval: 5s
      timeout: 3s
      retries: 10

  carma:
    build: .
    ports:
      - "7100:7100"
    environment:
      PORT: 7100
      TRUST_DOMAIN: acme
      DATABASE_URL: postgres://carma:carma@db:5432/carma
      # Ed25519 keys (PEM). PUBLIC_KEY verifies capability tokens; PRIVATE_KEY
      # signs stored envelopes. Provide via a .env file or a secret manager.
      PUBLIC_KEY: ${PUBLIC_KEY:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
